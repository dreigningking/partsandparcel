<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Your Device - Step 2</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:'#4285F4',secondary:'#34A853'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <style>
        :where([class^="ri-"])::before { content: "\f3c2"; }
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <header class="border-b border-gray-100 py-4 px-6">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-12">
                <a href="#" class="text-primary text-2xl font-['Pacifico']">logo</a>
                <nav class="hidden md:flex">
                    <ul class="flex gap-8">
                        <li><a href="#" class="text-gray-600 hover:text-primary">Home</a></li>
                        <li><a href="#" class="text-gray-600 hover:text-primary">Browse</a></li>
                        <li><a href="#" class="text-primary font-medium">Sell</a></li>
                        <li><a href="#" class="text-gray-600 hover:text-primary">My Account</a></li>
                    </ul>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <button class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-primary">
                    <i class="ri-search-line ri-lg"></i>
                </button>
                <button class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-primary">
                    <i class="ri-heart-line ri-lg"></i>
                </button>
                <button class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-primary">
                    <i class="ri-user-line ri-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8 max-w-3xl">
        <h1 class="text-2xl font-bold text-gray-900">Sell Your Device</h1>
        
        <!-- Progress bar -->
        <div class="mt-4">
            <div class="flex justify-between items-center mb-1">
                <span class="text-sm text-gray-600">Step 2 of 3</span>
                <span class="text-sm text-gray-600">66%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-primary h-2 rounded-full" style="width: 66%"></div>
            </div>
        </div>

        <!-- Step indicators -->
        <div class="flex justify-between mt-6 mb-8">
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm">1</div>
                <span class="text-xs mt-1 text-gray-600">Details</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm">2</div>
                <span class="text-xs mt-1 text-gray-600">Listing</span>
            </div>
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-sm">3</div>
                <span class="text-xs mt-1 text-gray-600">Review</span>
            </div>
        </div>

        <!-- Selling Type Selection -->
        <div class="mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Choose Selling Type</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Sell as Whole option -->
                <label class="relative cursor-pointer">
                    <input type="radio" name="sellingType" value="whole" class="sr-only" checked>
                    <div class="border border-gray-200 rounded p-6 transition-all hover:border-primary peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary h-full">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 flex items-center justify-center bg-blue-100 rounded-full text-primary">
                                <i class="ri-smartphone-line ri-lg"></i>
                            </div>
                            <div>
                                <h3 class="font-medium text-gray-900">Sell as Whole Device</h3>
                                <p class="text-sm text-gray-600 mt-1">List your complete device with all its components</p>
                            </div>
                        </div>
                    </div>
                </label>

                <!-- Sell in Parts option -->
                <label class="relative cursor-pointer">
                    <input type="radio" name="sellingType" value="parts" class="sr-only">
                    <div class="border border-gray-200 rounded p-6 transition-all hover:border-primary peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary h-full">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 flex items-center justify-center bg-green-100 rounded-full text-green-600">
                                <i class="ri-tools-line ri-lg"></i>
                            </div>
                            <div>
                                <h3 class="font-medium text-gray-900">Sell in Parts</h3>
                                <p class="text-sm text-gray-600 mt-1">List individual components of your device separately</p>
                            </div>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <!-- Sell as Whole Form (default visible) -->
        <div id="sellAsWholeForm" class="mb-8">
            <div class="mb-6">
                <label for="issueDescription" class="block text-sm font-medium text-gray-700 mb-2">What is wrong with the product?</label>
                <textarea id="issueDescription" rows="4" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="Describe any issues, defects or problems with the device..."></textarea>
            </div>

            <div class="mb-6">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-medium text-gray-700">Has it been repaired before?</label>
                    <div class="relative inline-block w-12 h-6 transition duration-200 ease-in-out">
                        <input type="checkbox" id="repairToggle" class="opacity-0 w-0 h-0">
                        <label for="repairToggle" class="absolute cursor-pointer top-0 left-0 right-0 bottom-0 bg-gray-300 rounded-full transition-all duration-300 before:absolute before:content-[''] before:h-4 before:w-4 before:left-1 before:bottom-1 before:bg-white before:rounded-full before:transition-all before:duration-300"></label>
                    </div>
                </div>
                
                <div id="repairDetailsContainer" class="mt-4 hidden">
                    <label for="repairDetails" class="block text-sm font-medium text-gray-700 mb-2">Describe previous repairs</label>
                    <textarea id="repairDetails" rows="3" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="What repairs were done and when?"></textarea>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload Images</label>
                <div class="border-2 border-dashed border-gray-300 rounded-md p-6 text-center">
                    <div class="w-12 h-12 mx-auto mb-4 flex items-center justify-center bg-blue-50 rounded-full text-primary">
                        <i class="ri-image-add-line ri-xl"></i>
                    </div>
                    <p class="text-sm text-gray-600 mb-2">Drag and drop your images here, or click to browse</p>
                    <p class="text-xs text-gray-500 mb-4">Maximum 8 images, JPG or PNG, up to 5MB each</p>
                    <button type="button" class="px-4 py-2 bg-blue-50 text-primary rounded-button text-sm font-medium hover:bg-blue-100 transition-colors whitespace-nowrap">Browse Files</button>
                    <input type="file" multiple accept="image/*" class="hidden">
                </div>
                
                <div class="grid grid-cols-4 gap-3 mt-4">
                    <!-- Empty image preview placeholders -->
                    <div class="aspect-square bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                        <i class="ri-add-line ri-lg text-gray-400"></i>
                    </div>
                    <div class="aspect-square bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                        <i class="ri-add-line ri-lg text-gray-400"></i>
                    </div>
                    <div class="aspect-square bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                        <i class="ri-add-line ri-lg text-gray-400"></i>
                    </div>
                    <div class="aspect-square bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                        <i class="ri-add-line ri-lg text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sell in Parts Form (initially hidden) -->
        <div id="sellInPartsForm" class="mb-8 hidden">
            <h3 class="text-lg font-medium text-gray-800 mb-4">Select Parts to Sell</h3>
            
            <div class="space-y-4">
                <!-- Battery -->
                <div class="border border-gray-200 rounded-md p-4">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="partBattery" class="w-4 h-4 text-primary focus:ring-primary rounded">
                            <label for="partBattery" class="font-medium text-gray-800">Battery</label>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-500 mr-2">Price:</span>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">$</span>
                                <input type="number" class="w-24 pl-7 py-1 border border-gray-300 rounded text-right" placeholder="0.00">
                            </div>
                        </div>
                    </div>
                    
                    <div class="border-t border-gray-100 pt-3">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Upload Images</label>
                        <div class="flex gap-2">
                            <div class="w-16 h-16 bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                                <i class="ri-add-line ri-lg text-gray-400"></i>
                            </div>
                            <div class="w-16 h-16 bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                                <i class="ri-add-line ri-lg text-gray-400"></i>
                            </div>
                            <button class="w-16 h-16 bg-blue-50 rounded flex flex-col items-center justify-center text-primary hover:bg-blue-100 transition-colors">
                                <i class="ri-add-line ri-lg"></i>
                                <span class="text-xs mt-1">Add</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Screen -->
                <div class="border border-gray-200 rounded-md p-4">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="partScreen" class="w-4 h-4 text-primary focus:ring-primary rounded">
                            <label for="partScreen" class="font-medium text-gray-800">Screen</label>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-500 mr-2">Price:</span>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">$</span>
                                <input type="number" class="w-24 pl-7 py-1 border border-gray-300 rounded text-right" placeholder="0.00">
                            </div>
                        </div>
                    </div>
                    
                    <div class="border-t border-gray-100 pt-3">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Upload Images</label>
                        <div class="flex gap-2">
                            <div class="w-16 h-16 bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                                <i class="ri-add-line ri-lg text-gray-400"></i>
                            </div>
                            <div class="w-16 h-16 bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                                <i class="ri-add-line ri-lg text-gray-400"></i>
                            </div>
                            <button class="w-16 h-16 bg-blue-50 rounded flex flex-col items-center justify-center text-primary hover:bg-blue-100 transition-colors">
                                <i class="ri-add-line ri-lg"></i>
                                <span class="text-xs mt-1">Add</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Motherboard -->
                <div class="border border-gray-200 rounded-md p-4">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="partMotherboard" class="w-4 h-4 text-primary focus:ring-primary rounded">
                            <label for="partMotherboard" class="font-medium text-gray-800">Motherboard</label>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-500 mr-2">Price:</span>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">$</span>
                                <input type="number" class="w-24 pl-7 py-1 border border-gray-300 rounded text-right" placeholder="0.00">
                            </div>
                        </div>
                    </div>
                    
                    <div class="border-t border-gray-100 pt-3">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Upload Images</label>
                        <div class="flex gap-2">
                            <div class="w-16 h-16 bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                                <i class="ri-add-line ri-lg text-gray-400"></i>
                            </div>
                            <div class="w-16 h-16 bg-gray-100 rounded flex items-center justify-center border border-gray-200">
                                <i class="ri-add-line ri-lg text-gray-400"></i>
                            </div>
                            <button class="w-16 h-16 bg-blue-50 rounded flex flex-col items-center justify-center text-primary hover:bg-blue-100 transition-colors">
                                <i class="ri-add-line ri-lg"></i>
                                <span class="text-xs mt-1">Add</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Add Custom Part button -->
                <button type="button" class="w-full py-3 border border-dashed border-gray-300 rounded-md flex items-center justify-center gap-2 text-primary hover:bg-blue-50 transition-colors !rounded-button whitespace-nowrap">
                    <i class="ri-add-line ri-lg"></i>
                    <span>Add Custom Part</span>
                </button>
            </div>
        </div>

        <!-- Navigation buttons -->
        <div class="flex justify-between mt-8">
            <button type="button" class="px-6 py-2.5 border border-gray-300 rounded-button text-gray-700 font-medium hover:bg-gray-50 transition-colors whitespace-nowrap">Back</button>
            <button type="button" class="px-6 py-2.5 bg-primary text-white rounded-button font-medium hover:bg-blue-600 transition-colors whitespace-nowrap">Next Step</button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle between selling types
            const sellingTypeRadios = document.querySelectorAll('input[name="sellingType"]');
            const sellAsWholeForm = document.getElementById('sellAsWholeForm');
            const sellInPartsForm = document.getElementById('sellInPartsForm');
            
            sellingTypeRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.value === 'whole') {
                        sellAsWholeForm.classList.remove('hidden');
                        sellInPartsForm.classList.add('hidden');
                    } else {
                        sellAsWholeForm.classList.add('hidden');
                        sellInPartsForm.classList.remove('hidden');
                    }
                });
            });
            
            // Toggle repair details
            const repairToggle = document.getElementById('repairToggle');
            const repairDetailsContainer = document.getElementById('repairDetailsContainer');
            
            repairToggle.addEventListener('change', function() {
                if (this.checked) {
                    repairDetailsContainer.classList.remove('hidden');
                } else {
                    repairDetailsContainer.classList.add('hidden');
                }
            });
            
            // Style the toggle switch
            const toggleLabel = document.querySelector('label[for="repairToggle"]');
            repairToggle.addEventListener('change', function() {
                if (this.checked) {
                    toggleLabel.classList.add('bg-primary');
                    toggleLabel.classList.remove('bg-gray-300');
                    toggleLabel.classList.add('before:translate-x-6');
                } else {
                    toggleLabel.classList.remove('bg-primary');
                    toggleLabel.classList.add('bg-gray-300');
                    toggleLabel.classList.remove('before:translate-x-6');
                }
            });
        });
    </script>
</body>
</html>
