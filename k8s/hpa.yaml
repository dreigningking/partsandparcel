apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pp-web-hpa
  namespace: partsandparcel
  labels:
    app.kubernetes.io/name: partsandparcel
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pp-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100 # Double capacity quickly during traffic spikes
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 minutes of low traffic before scaling down
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
