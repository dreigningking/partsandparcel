apiVersion: v1
kind: ConfigMap
metadata:
  name: pp-config
  namespace: partsandparcel
  labels:
    app.kubernetes.io/name: partsandparcel
data:
  APP_NAME: "Parts & Parcel"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://partsandparcel.com"

  # Database settings (host points to AWS RDS or internal service)
  DB_CONNECTION: "mysql"
  DB_HOST: "partsandparcel-db.cluster-xyz.us-east-1.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_DATABASE: "partsandparcel_prod"

  # Cache, Session & Queues (pointing to AWS ElastiCache Redis)
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_HOST: "partsandparcel-redis.xyz.use1.cache.amazonaws.com"
  REDIS_PORT: "6379"

  # Logging & Maintenance
  LOG_CHANNEL: "stack"
  LOG_STACK: "single"
  LOG_LEVEL: "info"

  # Broadcaster & Realtime
  BROADCAST_CONNECTION: "reverb"
  REVERB_HOST: "partsandparcel.com"
  REVERB_PORT: "443"
  REVERB_SCHEME: "https"
