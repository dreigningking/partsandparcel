apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pp-ingress
  namespace: partsandparcel
  annotations:
    # Use standard ingress-nginx controller or AWS ALB
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - partsandparcel.com
        - www.partsandparcel.com
      secretName: pp-tls-cert
  rules:
    - host: partsandparcel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pp-web-service
                port:
                  number: 80
    - host: www.partsandparcel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pp-web-service
                port:
                  number: 80
