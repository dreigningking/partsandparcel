<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make / Manage Offer — Parts &amp; Parcel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pp: { 50: '#f5f3ff', 100: '#ebe7ff', 200: '#d9d2ff', 500: '#5140c8', 600: '#4634b7', 700: '#38299b', 900: '#20165f' }
          },
          boxShadow: { soft: '0 8px 30px rgba(42, 31, 120, .08)' }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50/60 text-slate-900 pb-16 lg:pb-0">

<!-- HEADER -->
<header class="bg-white border-b border-slate-200 py-4">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-pp-600 text-white grid place-items-center font-bold">P</div>
      <span class="text-lg font-extrabold text-slate-900">Parts &amp; Parcel</span>
    </a>
    <a href="seller-offers.html" class="text-xs font-bold text-pp-600 hover:underline">Seller Offer Portal →</a>
  </div>
</header>

<main class="max-w-[900px] mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
  
  <div>
    <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold uppercase">
      OFFER STATUS: PENDING ACCEPTANCE
    </span>
    <h1 class="text-2xl font-extrabold text-slate-950 mt-2">Negotiate &amp; Make an Offer</h1>
    <p class="text-xs text-slate-500 mt-1">Listing: <span class="font-bold text-slate-900">HP EliteBook 840 G5 Laptop</span> (Listed by Adam Computers @ ₦280,000)</p>
  </div>

  <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 space-y-6 shadow-soft">
    
    <!-- OFFER INPUT FIELDS -->
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-extrabold text-slate-900 uppercase mb-2">Original Price</label>
        <input readonly class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-sm font-bold text-slate-500 outline-none" value="₦280,000" />
      </div>

      <div>
        <label class="block text-xs font-extrabold text-slate-900 uppercase mb-2">Your Offer Price (₦)</label>
        <input class="w-full p-3 bg-white border-2 border-pp-600 rounded-xl text-sm font-extrabold text-slate-900 outline-none" value="₦255,000" />
      </div>
    </div>

    <div>
      <label class="block text-xs font-extrabold text-slate-900 uppercase mb-2">Quantity Required</label>
      <select class="w-full p-3 border border-slate-200 rounded-xl text-xs font-bold outline-none">
        <option selected>1 Unit</option>
        <option>2 Units</option>
        <option>3 Units</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-extrabold text-slate-900 uppercase mb-2">Message to Seller (Optional)</label>
      <textarea class="w-full h-24 p-3 border border-slate-200 rounded-xl text-xs outline-none" placeholder="e.g. I can pick up today at Computer Village if offer is accepted."></textarea>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row gap-3">
      <a href="checkout.html?offer=accepted" class="flex-1 py-3.5 rounded-xl bg-pp-600 hover:bg-pp-700 text-white font-extrabold text-xs text-center shadow-sm">
        Submit Offer (₦255,000) →
      </a>
      <a href="listing-detail.html" class="px-6 py-3.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs text-center">
        Cancel
      </a>
    </div>

  </div>

</main>

</body>
</html>
