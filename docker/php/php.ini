[PHP]
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 50M
post_max_size = 55M
variables_order = "EGPCS"

; Error reporting - Log errors to stdout/stderr in Docker, never display to visitors
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance - Zend OPcache configuration
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; In immutable production Docker containers, file modification times never change.
; Setting validate_timestamps = 0 skips stat() calls and gives maximum throughput.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
