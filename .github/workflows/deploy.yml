name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# Ensure only one deployment runs at a time
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # STEP 1: VERIFY CODE PASSES ALL TESTS BEFORE BUILDING DOCKER IMAGE
  # ============================================================================
  verify:
    name: Verify Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, gd, zip
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute Fast Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
        run: php artisan test

  # ============================================================================
  # STEP 2: BUILD DOCKER IMAGE & PUSH TO DOCKER HUB
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/partsandparcel
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cloud Cache to make future Docker builds take seconds instead of minutes
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STEP 3: DEPLOY TO AWS EC2 (Zero-Downtime Rolling Container Update)
  # ============================================================================
  deploy:
    name: Deploy to Production EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        if: "${{ env.SSH_HOST != '' }}"
        env:
          SSH_HOST: ${{ secrets.PROD_SERVER_IP }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/partsandparcel
            echo "Pulling latest Docker image from Docker Hub..."
            docker compose pull app
            echo "Restarting application container with zero-downtime..."
            docker compose up -d --no-deps app
            echo "Pruning dangling images to reclaim disk space..."
            docker image prune -f
            echo "Deployment successfully finished!"
