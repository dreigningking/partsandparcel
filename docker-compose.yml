services:
  # ============================================================================
  # 1. APPLICATION & WEB SERVER (PHP 8.3-FPM + Nginx + Queue Worker)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: partsandparcel:latest
    container_name: partsandparcel_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Parts & Parcel"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: partsandparcel
      DB_USERNAME: pp_user
      DB_PASSWORD: pp_secret_password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: null
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pp_network

  # ============================================================================
  # 2. DATABASE (MySQL 8.0)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: partsandparcel_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: partsandparcel
      MYSQL_USER: pp_user
      MYSQL_PASSWORD: pp_secret_password
      MYSQL_ROOT_PASSWORD: pp_root_password
    volumes:
      - pp_mysql_data:/var/lib/mysql
    networks:
      - pp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppp_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. IN-MEMORY CACHE & QUEUE BROKER (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: partsandparcel_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - pp_redis_data:/data
    networks:
      - pp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============================================================================
  # 4. LOCAL EMAIL TESTING & INSPECTOR (Mailpit)
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: partsandparcel_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI to view emails
      - "1025:1025" # SMTP server port
    networks:
      - pp_network

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================
networks:
  pp_network:
    driver: bridge

volumes:
  pp_mysql_data:
    driver: local
  pp_redis_data:
    driver: local
